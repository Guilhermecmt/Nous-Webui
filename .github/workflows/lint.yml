name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    # Windows de proposito: o lint usa o powershell.exe 5.1, o mesmo que roda
    # os scripts do Nous na maquina dos usuarios.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias dos testes do e-mail (servidor IMAP/SMTP falso)
        run: python -m pip install aiohttp requests beautifulsoup4 pypdf python-dateutil
      - uses: actions/setup-node@v4
        with:
          # O Nous Code roda TypeScript direto, o que pede Node 22.18+
          node-version: "22"
      - name: Dependencias do Nous Code (para checar os tipos)
        run: npm ci --prefix code --ignore-scripts --no-audit --no-fund
      - name: Checagens do Nous
        shell: powershell
        run: .\tools\lint.ps1
